name: 每日热点新闻简报

on:
  schedule:
    # 每天 UTC 00:00 = 北京时间 08:00
    - cron: '0 0 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  # 需要写权限：把渲染好的长图提交进仓库，作为 jsDelivr 图床的图片源
  contents: write

jobs:
  daily-news:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装中文字体（用于图片渲染）
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 阶段1：采集新闻 + 渲染长图 + 生成推送正文
      - name: 采集并渲染长图
        run: python main.py render

      # 阶段2：长图提交进仓库（jsDelivr 会通过仓库地址直接加载图片）
      # 每天文件名不同，不存在 CDN 缓存过期问题；同时清理 7 天前的旧图防止仓库膨胀
      - name: 提交长图到仓库（图床）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find outputs -name '*.png' -mtime +6 -delete 2>/dev/null || true
          git add -A -- outputs
          if git diff --cached --quiet; then
            echo "图片无变化，跳过提交"
          else
            git commit -m "chore: add briefing image $(date -u +%F)"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:${{ github.ref }}"
          fi

      # 阶段3：拼接 jsDelivr 长图链接，推送微信
      - name: 推送到微信
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python main.py push
